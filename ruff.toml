# Vibe Engineering — 린트 설정
#
# 런타임 의존성은 여전히 0이다. ruff 는 CI 에서만 쓰는 개발 도구이며
# 사용자가 설치할 것은 아무것도 늘지 않는다.

target-version = "py311"   # CI 매트릭스의 하한. 여기를 올리려면 먼저 CI 를 올린다

[lint]
# 결함을 잡는 규칙만 켠다. 취향 규칙은 동작하는 코드를 스타일 때문에
# 건드리게 만들고, 그러다 생긴 회귀가 린터로 얻는 것보다 비싸다.
#   F   pyflakes      — 미정의 이름, 미사용 import/변수
#   E9  syntax/runtime errors
#   B   bugbear       — 실제 버그 패턴 (except 체인 유실, 미사용 루프 변수 등)
select = ["F", "E9", "B"]

# 도입 시점(2026-08-15) 평가하고 보류한 것:
#
#   S (bandit)  73건 중 대부분이 S603/S607/S310 이다.
#               S603·S607 은 git·launchctl 호출 전부에, S310 은 urlopen 전부에 걸린다.
#               이 프로젝트에서는 모두 의도된 호출이고, 인자도 사용자 입력이 아니다.
#               감사(audit)용 규칙이라 전면 적용하면 noqa 만 늘어난다.
#               → 외부 입력이 명령이나 URL 에 닿는 코드가 생기면 그때 개별 도입한다.
#   I   (import 정렬) 11건. 순수 스타일이라 결함 규칙이 안정된 뒤에 본다.
#   UP  (pyupgrade)  target-version 을 올릴 때 함께 검토한다.

[lint.per-file-ignores]
# 테스트는 예외를 삼켜도 되는 자리가 있다
"tests/*" = ["B017"]
