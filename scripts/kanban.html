<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibe Harness</title>
<style>
/* ── Theme ── */
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1c2129;
  --border: #30363d; --border-light: #3d444d;
  --text: #e6edf3; --text-dim: #8b949e; --text-faint: #656d76;
  --accent: #58a6ff; --accent-dim: rgba(88,166,255,0.15);
  --red: #f85149; --orange: #d29922; --green: #3fb950; --purple: #a371f7;
  --backlog: #8b949e; --todo: #d29922; --in_progress: #58a6ff; --review: #a371f7; --done: #3fb950;
}
:root.light {
  --bg: #ffffff; --surface: #f6f8fa; --surface2: #eef1f5;
  --border: #d0d7de; --border-light: #e1e4e8;
  --text: #1f2328; --text-dim: #656d76; --text-faint: #8b949e;
  --accent: #0969da; --accent-dim: rgba(9,105,218,0.1);
  --red: #cf222e; --orange: #bf8700; --green: #1a7f37; --purple: #8250df;
  --backlog: #8b949e; --todo: #bf8700; --in_progress: #0969da; --review: #8250df; --done: #1a7f37;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── Header ── */
header {
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  background: var(--surface); gap: 8px;
}
.h-left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.logo { font-size:16px; font-weight:800; color:var(--text-dim); letter-spacing:-0.5px; white-space:nowrap; }
/* ── Project Selector Dropdown ── */
.proj-select { position:relative; }
.proj-btn {
  display:flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:7px; font-size:13px; font-weight:600;
  cursor:pointer; border:1px solid var(--border); background:var(--surface);
  color:var(--text); transition:all .12s; white-space:nowrap;
  min-width:160px; justify-content:space-between;
}
.proj-btn:hover { border-color:var(--accent); color:var(--accent); }
.proj-btn .proj-arrow { font-size:9px; color:var(--text-faint); margin-left:2px; }
.proj-dropdown {
  display:none; position:absolute; top:calc(100% + 5px); left:0;
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  min-width:180px; z-index:200; overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.proj-dropdown.open { display:block; }
.proj-drop-item {
  padding:9px 16px; font-size:13px; cursor:pointer; transition:background .1s;
  display:flex; align-items:center; gap:8px; color:var(--text-dim);
}
.proj-drop-item:hover { background:var(--surface2); color:var(--text); }
.proj-drop-item.active { color:var(--accent); font-weight:700; }
.proj-drop-dot { width:7px; height:7px; border-radius:50%; background:var(--border); flex-shrink:0; }
.proj-drop-item.active .proj-drop-dot { background:var(--accent); }
.view-tabs { display:flex; gap:1px; background:var(--border); border-radius:8px; padding:2px; margin-left:8px; }
.vtab {
  padding:6px 13px; border-radius:6px; font-size:11px; font-weight:600;
  cursor:pointer; color:var(--text-dim); background:transparent; border:none; transition:all .12s;
}
.vtab.active { background:var(--surface); color:var(--text); }
.h-right { display:flex; align-items:center; gap:16px; flex-shrink:0; }
.stats { display:flex; gap:16px; font-size:12px; color:var(--text-dim); }
.stats b { color:var(--text); font-size:13px; margin-right:1px; }
.stats .s-ip b { color:var(--in_progress); }
.stats .s-dn b { color:var(--done); }
.icon-btn {
  background:none; border:1px solid var(--border); border-radius:7px;
  color:var(--text-dim); cursor:pointer; padding:6px 10px; font-size:15px; transition:all .12s;
}
.icon-btn:hover { color:var(--text); border-color:var(--accent); }

/* ── Main ── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* ── Kanban Board ── */
.kanban { display:flex; gap:10px; padding:10px 12px; flex:1; overflow-x:auto; overflow-y:hidden; }
.kanban.hide { display:none; }
.column {
  min-width:280px; flex:1; display:flex; flex-direction:column;
  background:var(--surface); border-radius:10px; border:1px solid var(--border); overflow:hidden;
}
.col-head {
  padding:8px 12px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.col-label { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
.dot { width:8px; height:8px; border-radius:50%; }
.col-cnt { background:var(--border); padding:1px 6px; border-radius:8px; font-size:10px; color:var(--text-dim); }
.col-body {
  flex:1; overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:5px;
}
.col-body::-webkit-scrollbar { width:3px; }
.col-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.add-btn {
  margin:5px 6px; padding:5px; border:1px dashed var(--border); border-radius:6px;
  background:none; color:var(--text-dim); cursor:pointer; font-size:11px; text-align:center; flex-shrink:0;
}
.add-btn:hover { border-color:var(--accent); color:var(--accent); }

/* ── Cards (bigger, show description) ── */
.card {
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; cursor:pointer; transition:all .12s; position:relative;
}
.card:hover { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.card.dragging { opacity:.3; }
.card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:4px; }
.card-title { font-size:13px; font-weight:600; line-height:1.4; flex:1; }
.card-desc { font-size:11px; color:var(--text-dim); line-height:1.4; margin-top:4px; }
.card-meta { display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-top:6px; }
.card-acts {
  display:none; gap:2px; flex-shrink:0;
}
.card:hover .card-acts { display:flex; }
.card-act {
  background:none; border:none; color:var(--text-faint); cursor:pointer;
  font-size:13px; padding:1px 4px; border-radius:3px; line-height:1;
}
.card-act:hover { background:var(--border); color:var(--text); }
.card-act.del:hover { color:var(--red); }
.tag {
  font-size:9px; padding:1px 5px; border-radius:3px; font-weight:600;
  background:var(--border); color:var(--text-dim);
}
.tag.high { background:var(--red); color:#fff; }
.tag.medium { background:var(--orange); color:#fff; }
.tag.low { background:var(--green); color:#fff; }
.tag.user { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(88,166,255,.2); }
.dday { font-size:9px; font-weight:700; padding:1px 6px; border-radius:3px; margin-left:auto; }
.dday.overdue { background:var(--red); color:#fff; }
.dday.soon { background:var(--orange); color:#fff; }
.dday.ok { background:var(--border); color:var(--accent); }
.lines-bar { display:inline-flex; align-items:center; gap:1px; height:6px; border-radius:2px; overflow:hidden; background:var(--border); vertical-align:middle; }
.lines-bar .a { background:var(--green); height:100%; }
.lines-bar .r { background:var(--red); height:100%; }
.lines-lbl { font-size:8px; color:var(--text-faint); margin-left:2px; }

/* Drop zone */
.drop-zone { min-height:30px; border:2px dashed transparent; border-radius:6px; transition:all .15s; }
.drop-zone.over { border-color:var(--accent); background:var(--accent-dim); }

/* ── List View ── */
.list-wrap { flex:1; overflow:auto; display:none; }
.list-wrap.active { display:block; }
.list-table { width:100%; border-collapse:collapse; font-size:11px; }
.list-table th {
  position:sticky; top:0; background:var(--surface); border-bottom:2px solid var(--border);
  padding:6px 8px; text-align:left; font-size:10px; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:.3px; z-index:1;
}
.list-table td {
  padding:5px 8px; border-bottom:1px solid var(--border);
  max-width:300px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list-table td.desc-cell {
  white-space:pre-wrap; word-break:break-word; max-width:400px; overflow:visible;
}
.list-table tr:hover { background:var(--surface2); }
.list-table td[contenteditable]:focus { outline:1px solid var(--accent); background:var(--bg); border-radius:2px; white-space:normal; }
.list-table select {
  background:var(--bg); color:var(--text); border:1px solid var(--border);
  border-radius:3px; font-size:10px; padding:2px 4px;
}
.list-del { background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; }
.list-del:hover { color:var(--red); }
.done-row { opacity:.6; }
.done-row .card-title-cell { text-decoration:line-through; }

/* ── Resizer ── */
.resizer {
  height:4px; cursor:row-resize; background:var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.resizer::after { content:''; width:30px; height:2px; background:var(--text-faint); border-radius:1px; }
.resizer.hide { display:none; }

/* ── Done Zone (kanban mode only) ── */
.done-zone {
  height:220px; min-height:60px; max-height:65vh;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.done-zone.hide { display:none; }
.done-head {
  padding:6px 14px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.done-head h3 { font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; }
.done-head .cnt { color:var(--done); }
.done-tabs { display:flex; gap:1px; background:var(--border); border-radius:5px; padding:1px; }
.dtab {
  padding:3px 8px; border-radius:4px; font-size:9px; font-weight:600;
  cursor:pointer; color:var(--text-dim); background:transparent; border:none; transition:all .1s;
}
.dtab.active { background:var(--surface2); color:var(--text); }
.done-body { flex:1; overflow-y:auto; padding:8px 14px; }
.done-body::-webkit-scrollbar { width:3px; }
.done-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.done-group { margin-bottom:12px; }
.done-gh {
  font-size:10px; font-weight:600; color:var(--text-dim);
  margin-bottom:4px; padding-bottom:3px; border-bottom:1px solid var(--border);
}
.done-gh span { color:var(--text-faint); font-weight:400; }
.done-list { display:flex; flex-wrap:wrap; gap:5px; }
.done-card {
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; cursor:pointer; transition:all .12s;
  min-width:240px; max-width:380px; flex:1;
}
.done-card:hover { border-color:var(--done); box-shadow:0 0 0 1px var(--done); }
.done-card .card-top { display:flex; align-items:flex-start; gap:4px; }
.done-card .card-title { font-size:13px; font-weight:600; line-height:1.4; flex:1; }
.done-card .done-ck { color:var(--done); font-size:13px; flex-shrink:0; margin-right:4px; }
.done-card .card-desc { font-size:11px; color:var(--text-dim); line-height:1.4; margin-top:4px; }
.done-card .card-meta { display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-top:6px; }

/* ── Detail Panel ── */
.detail-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; }
.detail-bg.open { display:flex; justify-content:flex-end; }
.detail {
  width:520px; max-width:92vw; background:var(--surface); height:100%;
  overflow-y:auto; border-left:1px solid var(--border); animation:slideIn .18s ease-out;
}
@keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
.det-head { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; }
.det-head h2 { font-size:16px; font-weight:600; line-height:1.3; flex:1; }
.det-close { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:18px; padding:2px 6px; border-radius:4px; }
.det-close:hover { background:var(--border); color:var(--text); }
.det-body { padding:16px 20px; }
.det-field { margin-bottom:14px; }
.det-label { font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
.det-val { font-size:13px; line-height:1.5; }
.det-val pre {
  background:var(--bg); border:1px solid var(--border); border-radius:6px;
  padding:10px; font-size:11px; white-space:pre-wrap; word-break:break-word;
  font-family:'SF Mono','Fira Code',monospace; line-height:1.4;
}
.det-tags { display:flex; gap:4px; flex-wrap:wrap; }
.det-acts { padding:12px 20px; border-top:1px solid var(--border); display:flex; gap:6px; }

/* ── Modal ── */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; align-items:center; justify-content:center; }
.modal-bg.open { display:flex; }
.modal {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:20px; width:460px; max-width:90vw; max-height:88vh; overflow-y:auto;
}
.modal h2 { font-size:14px; margin-bottom:12px; }
.modal label { display:block; font-size:9px; color:var(--text-dim); margin:8px 0 2px; text-transform:uppercase; letter-spacing:.3px; }
.modal input, .modal textarea, .modal select {
  width:100%; padding:6px 8px; background:var(--bg); border:1px solid var(--border);
  border-radius:5px; color:var(--text); font-size:12px; font-family:inherit;
}
.modal textarea { resize:vertical; min-height:60px; font-family:'SF Mono','Fira Code',monospace; font-size:11px; }
.modal .row { display:flex; gap:8px; }
.modal .row > div { flex:1; }
.modal-acts { display:flex; justify-content:flex-end; gap:6px; margin-top:14px; }
.btn { padding:5px 12px; border-radius:5px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; font-size:12px; }
.btn:hover { border-color:var(--accent); }
.btn-pri { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-del { color:var(--red); }
.btn-del:hover { background:var(--red); color:#fff; border-color:var(--red); }

/* ── Review Section ── */
.review-section { margin-top:4px; }
.review-item {
  display:flex; align-items:flex-start; gap:8px; padding:6px 0;
  border-bottom:1px solid var(--border); font-size:12px;
}
.review-item:last-child { border-bottom:none; }
.review-text { flex:1; line-height:1.4; }
.review-text.resolved { text-decoration:line-through; color:var(--text-dim); }
.review-radio { display:flex; gap:2px; flex-shrink:0; }
.review-radio label {
  padding:2px 8px; border-radius:4px; font-size:10px; font-weight:600;
  cursor:pointer; border:1px solid var(--border); color:var(--text-dim); transition:all .12s;
  user-select:none;
}
.review-radio input { display:none; }
.review-radio input:checked + span { color:#fff; }
.review-radio .rb-resolved input:checked + span { background:var(--green); border-color:var(--green); }
.review-radio .rb-unresolved input:checked + span { background:var(--orange); border-color:var(--orange); }
.review-radio label:has(input:checked) { border-color:transparent; }
.review-radio .rb-resolved:has(input:checked) { background:var(--green); border-color:var(--green); }
.review-radio .rb-unresolved:has(input:checked) { background:var(--orange); border-color:var(--orange); }
.review-radio .rb-resolved:has(input:checked) { color:#fff; }
.review-radio .rb-unresolved:has(input:checked) { color:#fff; }
.review-summary {
  display:flex; gap:8px; font-size:10px; margin-top:6px; color:var(--text-dim);
}
.review-summary .rs-ok { color:var(--green); font-weight:600; }
.review-summary .rs-ng { color:var(--orange); font-weight:600; }
.review-badge {
  font-size:8px; padding:1px 5px; border-radius:3px; font-weight:700;
}
.review-badge.all-ok { background:var(--green); color:#fff; }
.review-badge.has-issues { background:var(--orange); color:#fff; }

/* ── Schema/ERD View ── */
.schema-wrap { flex:1; overflow:auto; display:none; padding:16px; }
.schema-wrap.active { display:block; }
.schema-info {
  display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;
}
.schema-info .file-tag {
  font-size:10px; padding:3px 8px; border-radius:4px; cursor:pointer;
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  transition:background .15s,color .15s,border-color .15s;
}
.schema-info .file-tag.active {
  background:var(--accent); border-color:var(--accent); color:#fff;
}
.schema-tbl.file-hidden { display:none; }
.schema-legend {
  display:flex; gap:10px; font-size:10px; color:var(--text-dim); margin-left:auto;
}
.schema-legend span { display:flex; align-items:center; gap:3px; }
.schema-legend .dot-pk { width:6px; height:6px; border-radius:50%; background:var(--orange); }
.schema-legend .dot-fk { width:6px; height:6px; border-radius:50%; background:var(--purple); }
.schema-legend .dot-uq { width:6px; height:6px; border-radius:50%; background:var(--accent); }
.schema-legend .dot-nn { width:6px; height:6px; border-radius:50%; background:var(--red); }
.schema-canvas { position:relative; }
.schema-svg {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:1;
}
.schema-svg line { stroke:var(--purple); stroke-width:1.5; opacity:.5; }
.schema-svg circle { fill:var(--purple); opacity:.7; }
.schema-grid {
  display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start;
  position:relative; z-index:2;
}
.schema-tbl {
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  min-width:240px; max-width:360px; overflow:hidden; flex-shrink:0;
}
.schema-tbl-head {
  padding:8px 12px; font-size:12px; font-weight:700;
  background:var(--surface2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:6px;
}
.schema-tbl-head .tbl-icon { color:var(--accent); font-size:11px; }
.schema-tbl-head .tbl-schema { color:var(--text-faint); font-weight:400; font-size:10px; }
.schema-col-row {
  display:flex; align-items:center; padding:3px 12px; font-size:11px;
  border-bottom:1px solid var(--border); gap:6px;
}
.schema-col-row:last-child { border-bottom:none; }
.schema-col-row:hover { background:var(--surface2); }
.schema-col-row[data-fk-target] { cursor:pointer; }
.schema-col-row[data-fk-target]:hover .schema-fk-ref { opacity:1; text-decoration:underline; }
@keyframes fkPulseIn {
  0%   { background:rgba(139,92,246,.0); }
  20%  { background:rgba(139,92,246,.45); }
  50%  { background:rgba(139,92,246,.2); }
  75%  { background:rgba(139,92,246,.38); }
  100% { background:rgba(139,92,246,.18); }
}
/* Static highlight — stays until class is removed. Animation is just the entrance pulse. */
.schema-col-row.fk-highlight {
  background:rgba(139,92,246,.18) !important;
  box-shadow:inset 0 0 0 1px var(--purple) !important;
  animation:fkPulseIn 1.5s ease;
}
.schema-col-name { font-weight:600; min-width:100px; flex-shrink:0; }
.schema-col-name.is-pk { color:var(--orange); }
.schema-col-name.is-fk { color:var(--purple); }
.schema-col-type { color:var(--text-dim); font-size:10px; flex:1; font-family:monospace; }
.schema-badges { display:flex; gap:3px; flex-shrink:0; }
.schema-badge {
  font-size:8px; font-weight:700; padding:1px 4px; border-radius:3px;
  text-transform:uppercase; letter-spacing:.3px;
}
.schema-badge.pk { background:var(--orange); color:#fff; }
.schema-badge.fk { background:var(--purple); color:#fff; }
.schema-badge.uq { background:var(--accent); color:#fff; }
.schema-badge.nn { background:rgba(248,81,73,.2); color:var(--red); }
.schema-badge.df { background:var(--border); color:var(--text-dim); }
.schema-fk-ref {
  font-size:9px; color:var(--purple); margin-left:2px; opacity:.8;
  white-space:nowrap;
}
.schema-idx-section {
  padding:4px 12px 6px; border-top:1px solid var(--border);
  background:var(--bg);
}
.schema-idx-label { font-size:9px; color:var(--text-faint); font-weight:600; margin-bottom:2px; text-transform:uppercase; letter-spacing:.3px; }
.schema-idx-row {
  font-size:10px; color:var(--text-dim); padding:1px 0;
  font-family:monospace; display:flex; align-items:center; gap:4px;
}
.schema-idx-row .idx-uq { color:var(--accent); font-size:8px; font-weight:700; }
.schema-rels-section {
  margin-top:16px; padding:12px; background:var(--surface);
  border:1px solid var(--border); border-radius:8px;
}
.schema-rels-section h4 {
  font-size:11px; color:var(--text-dim); margin-bottom:8px;
  text-transform:uppercase; letter-spacing:.3px;
}
.schema-rel-row {
  font-size:11px; padding:3px 0; color:var(--text); font-family:monospace;
  display:flex; align-items:center; gap:6px;
}
.schema-rel-arrow { color:var(--purple); font-weight:700; }
.schema-empty {
  text-align:center; padding:60px 20px; color:var(--text-dim); font-size:13px;
}
.schema-empty code { background:var(--surface2); padding:2px 6px; border-radius:3px; font-size:11px; }

/* ── Mission View ── */
.mission-wrap { flex:1; overflow-y:auto; display:none; padding:20px; }
.mission-wrap.active { display:block; }

.mission-phase-header {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--border); border-radius:12px;
  padding:20px 24px; margin-bottom:16px;
}
.mph-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.mph-name { font-size:20px; font-weight:800; color:var(--text); letter-spacing:-0.5px; }
.mph-pct { font-size:24px; font-weight:800; color:var(--accent); }
.mph-bar {
  height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:8px;
}
.mph-fill { height:100%; background:var(--accent); border-radius:4px; transition:width .4s ease; }
.mph-sub { font-size:12px; color:var(--text-dim); }
.mph-checks { font-size:11px; color:var(--text-faint); margin-top:4px; }

.mission-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
}
@media(max-width:700px){ .mission-grid { grid-template-columns:1fr; } }

.mission-panel {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px;
}
.mission-panel.full-width { grid-column:1/-1; }
.mp-label {
  font-size:10px; font-weight:700; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px;
}

.mission-task-card {
  display:flex; align-items:center; gap:8px; padding:8px 10px;
  background:var(--bg); border:1px solid var(--border); border-radius:6px;
  margin-bottom:6px; cursor:pointer; transition:border-color .12s;
}
.mission-task-card:hover { border-color:var(--accent); }
.mission-task-card.active { border-color:var(--in_progress); background:rgba(88,166,255,.05); }
.mtask-num { font-size:10px; color:var(--text-faint); font-family:monospace; flex-shrink:0; }
.mtask-title { font-size:13px; font-weight:600; flex:1; }
.mtask-elapsed { font-size:10px; color:var(--purple); flex-shrink:0; }

.mission-lock-item {
  padding:5px 8px; font-size:12px; color:var(--text-dim);
  border-left:2px solid var(--red); margin-bottom:4px; border-radius:0 4px 4px 0;
  background:rgba(248,81,73,.05);
}

.mission-check-item {
  display:flex; align-items:flex-start; gap:8px; padding:4px 0;
  font-size:12px; border-bottom:1px solid var(--border);
}
.mission-check-item:last-child { border-bottom:none; }
.mission-check-item.done { color:var(--text-dim); }
.check-icon { font-size:12px; color:var(--text-faint); flex-shrink:0; margin-top:1px; }
.mission-check-item.done .check-icon { color:var(--done); }
.check-text { flex:1; line-height:1.4; }
.mission-check-item.done .check-text { text-decoration:line-through; }

.mission-done-item {
  font-size:12px; color:var(--text-dim); padding:4px 0;
  border-bottom:1px solid var(--border); display:flex; align-items:center; gap:6px;
}
.mission-done-item:last-child { border-bottom:none; }
.mission-done-item::before { content:'✓'; color:var(--done); font-size:11px; flex-shrink:0; }

.mission-empty-msg { font-size:12px; color:var(--text-faint); padding:8px 0; }

.mission-stats-row {
  display:flex; gap:16px; margin-top:6px; flex-wrap:wrap;
}
.mission-stat { font-size:11px; color:var(--text-dim); }
.mission-stat b { color:var(--text); }

.mission-no-phase {
  text-align:center; padding:60px 20px; color:var(--text-dim);
}
.mission-no-phase h3 { font-size:16px; margin-bottom:8px; color:var(--text); }
.mission-no-phase p { font-size:12px; line-height:1.6; }
.mission-no-phase code { background:var(--surface2); padding:2px 6px; border-radius:3px; font-size:11px; }

/* ── Decision Log View ── */
.log-wrap { flex:1; overflow-y:auto; display:none; padding:20px; }
.log-wrap.active { display:block; }
.log-toolbar {
  display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap;
}
.log-toolbar h3 { font-size:14px; font-weight:700; flex:1; }
.dec-grid { display:flex; flex-direction:column; gap:10px; }
.dec-card {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; cursor:pointer; transition:border-color .12s;
  border-left:3px solid var(--accent);
}
.dec-card:hover { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-dim); }
.dec-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.dec-title { font-size:13px; font-weight:700; line-height:1.4; flex:1; }
.dec-meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; align-items:center; }
.dec-row { font-size:12px; color:var(--text-dim); margin-top:6px; line-height:1.5; }
.dec-row b { color:var(--text); font-weight:600; font-size:11px; }
.dec-row.revisit b { color:var(--orange); }
.dec-acts { display:flex; gap:2px; flex-shrink:0; }
.dec-act { background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:13px; padding:2px 5px; border-radius:3px; }
.dec-act:hover { background:var(--border); color:var(--text); }
.dec-act.del:hover { color:var(--red); }
.dec-empty { text-align:center; padding:60px 20px; color:var(--text-dim); }
.dec-empty h3 { font-size:15px; margin-bottom:8px; color:var(--text); }
.dec-empty p { font-size:12px; line-height:1.6; }
.dec-empty code { background:var(--surface2); padding:2px 6px; border-radius:3px; font-size:11px; }

/* ── Velocity / Stats View ── */
.stats-wrap { flex:1; overflow-y:auto; display:none; padding:20px; }
.stats-wrap.active { display:block; }
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
@media(max-width:700px){ .stats-grid { grid-template-columns:1fr; } }
.stats-panel {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px;
}
.stats-panel.full { grid-column:1/-1; }
.sp-label { font-size:10px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px; }
.sp-kpi-row { display:flex; gap:20px; flex-wrap:wrap; }
.sp-kpi { text-align:center; }
.sp-kpi-val { font-size:28px; font-weight:800; color:var(--accent); line-height:1; }
.sp-kpi-lbl { font-size:10px; color:var(--text-faint); margin-top:2px; }
.phase-row {
  display:flex; align-items:center; gap:10px; padding:6px 0;
  border-bottom:1px solid var(--border); font-size:12px;
}
.phase-row:last-child { border-bottom:none; }
.phase-name { min-width:130px; font-weight:600; flex-shrink:0; }
.phase-bar-wrap { flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
.phase-bar-fill { height:100%; background:var(--accent); border-radius:4px; transition:width .4s; }
.phase-pct { font-size:11px; color:var(--accent); font-weight:700; min-width:36px; text-align:right; flex-shrink:0; }
.phase-cost { font-size:10px; color:var(--purple); min-width:60px; text-align:right; flex-shrink:0; }
.trend-bars { display:flex; align-items:flex-end; gap:3px; overflow-x:auto; }
.trend-col { flex:1 1 0; min-width:6px; display:flex; flex-direction:column; align-items:center; }
.trend-bar-track { width:100%; height:64px; display:flex; align-items:flex-end; }
.trend-bar { width:100%; background:var(--accent); border-radius:2px 2px 0 0; min-height:2px; transition:height .3s; }
.trend-date { font-size:7px; color:var(--text-faint); writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap; margin-top:3px; }
.cat-row { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:11px; }
.cat-row:not(:last-child) { border-bottom:1px solid var(--border); }
.cat-name { min-width:80px; color:var(--text-dim); flex-shrink:0; }
.cat-bar-wrap { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.cat-bar-fill { height:100%; background:var(--purple); border-radius:3px; }
.cat-cost { font-size:10px; color:var(--purple); min-width:50px; text-align:right; }

/* ── Save indicator ── */
.save-toast {
  position:fixed; bottom:16px; right:16px; background:var(--done); color:#fff;
  padding:6px 14px; border-radius:6px; font-size:11px; font-weight:600;
  opacity:0; transition:opacity .2s; z-index:400; pointer-events:none;
}
.save-toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <div class="h-left">
    <span class="logo">Vibe Harness</span>
    <div class="proj-select" id="projSelect">
      <button class="proj-btn" id="projBtn" onclick="toggleProjDrop(event)">
        <span id="projLabel">—</span>
        <span class="proj-arrow">▾</span>
      </button>
      <div class="proj-dropdown" id="projDropdown"></div>
    </div>
    <div class="view-tabs">
      <button class="vtab" data-v="mission" onclick="setView('mission')">🎯 Mission</button>
      <button class="vtab active" data-v="kanban" onclick="setView('kanban')">🗂️ Kanban</button>
      <button class="vtab" data-v="list" onclick="setView('list')">📝 List</button>
      <button class="vtab" data-v="log" onclick="setView('log')">📋 Log</button>
      <button class="vtab" data-v="stats" onclick="setView('stats')">📊 Stats</button>
      <button class="vtab" data-v="schema" onclick="setView('schema')">🗄️ DB</button>
    </div>
  </div>
  <div class="h-right">
    <div class="stats">
      <span class="s-ip"><b id="sIP">0</b> 진행</span>
      <span><b id="sWait">0</b> 대기</span>
      <span class="s-dn"><b id="sDone">0</b> 완료</span>
      <span><b id="sAll">0</b> 전체</span>
    </div>
    <button class="icon-btn" onclick="toggleTheme()" title="Dark/Light">◐</button>
  </div>
</header>

<div class="main">
  <!-- Mission View -->
  <div class="mission-wrap" id="missionWrap"></div>

  <!-- Kanban View -->
  <div class="kanban" id="kanban"></div>

  <!-- Decision Log View -->
  <div class="log-wrap" id="logWrap"></div>

  <!-- Velocity / Stats View -->
  <div class="stats-wrap" id="statsWrap"></div>

  <!-- Schema/ERD View -->
  <div class="schema-wrap" id="schemaWrap"></div>

  <!-- List View -->
  <div class="list-wrap" id="listWrap">
    <table class="list-table">
      <thead><tr>
        <th>Status</th><th>Pri</th><th>Title</th><th>Description</th>
        <th>Category</th><th>Phase</th><th>Creator</th><th>Assignee</th><th>Target</th><th>Lines</th><th></th>
      </tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>

  <!-- Resizer -->
  <div class="resizer" id="resizer"></div>

  <!-- Done Zone (kanban mode) -->
  <div class="done-zone" id="doneZone">
    <div class="done-head">
      <h3><span style="color:var(--done)">&#x2713;</span> Done <span class="cnt" id="doneCnt">0</span></h3>
      <div class="done-tabs">
        <button class="dtab active" data-g="date" onclick="setDoneTab('date')">날짜별</button>
        <button class="dtab" data-g="category" onclick="setDoneTab('category')">카테고리별</button>
        <button class="dtab" data-g="phase" onclick="setDoneTab('phase')">Phase별</button>
      </div>
    </div>
    <div class="done-body" id="doneBody"></div>
  </div>
</div>

<!-- Detail -->
<div class="detail-bg" id="detBg" onclick="if(event.target===this)closeDet()">
  <div class="detail" id="detPanel"></div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="mTitle">작업 추가</h2>
    <input type="hidden" id="mId">
    <label>제목</label><input id="mName">
    <label>설명</label><input id="mDesc">
    <label>상세 내용</label><textarea id="mDetails" rows="4"></textarea>
    <div class="row">
      <div><label>상태</label><select id="mStatus">
        <option value="backlog">Backlog</option><option value="todo">To Do</option>
        <option value="in_progress">In Progress</option><option value="review">Review</option>
        <option value="done">Done</option>
      </select></div>
      <div><label>우선순위</label><select id="mPri">
        <option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option>
      </select></div>
    </div>
    <div class="row">
      <div><label>카테고리</label><input id="mCat"></div>
      <div><label>Phase</label><input id="mPhase"></div>
      <div><label>담당자</label><input id="mAssign" placeholder="git user.name"></div>
    </div>
    <div class="row">
      <div><label>목표일</label><input id="mTarget" placeholder="2026-03-15"></div>
      <div><label>시작일</label><input id="mStart" placeholder="자동"></div>
      <div><label>완료일</label><input id="mEnd" placeholder="자동"></div>
    </div>
    <div class="row">
      <div><label>추가 줄수</label><input type="number" id="mLA" value="0" min="0"></div>
      <div><label>삭제 줄수</label><input type="number" id="mLR" value="0" min="0"></div>
      <div><label>사용 토큰 (추정)</label><input type="number" id="mTokens" value="0" min="0" placeholder="예: 50000"></div>
    </div>
    <div class="modal-acts">
      <button class="btn btn-del" id="mDel" style="display:none;margin-right:auto" onclick="delTask()">삭제</button>
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-pri" onclick="saveModal()">저장</button>
    </div>
  </div>
</div>

<!-- Decision Modal -->
<div class="modal-bg" id="decModalBg" onclick="if(event.target===this)closeDecModal()">
  <div class="modal">
    <h2 id="decMHeading">결정 기록</h2>
    <input type="hidden" id="decMId">
    <label>결정 제목 <span style="color:var(--text-faint);font-size:9px">(무엇을 결정했나)</span></label>
    <input id="decMName" placeholder="예: SQLite WAL 유지 — PostgreSQL 전환 보류">
    <label>이유 (why)</label>
    <textarea id="decMWhy" rows="3" placeholder="이 결정을 내린 이유와 근거"></textarea>
    <label>재검토 조건 (revisit when)</label>
    <input id="decMRevisit" placeholder="예: 동시 접속 10명 초과 시">
    <div class="row">
      <div><label>Phase</label><input id="decMPhase" placeholder="PHASE_PMF01"></div>
      <div><label>연결 태스크 #ID</label><input type="number" id="decMTask" placeholder="선택사항"></div>
    </div>
    <div class="modal-acts">
      <button class="btn btn-del" id="decMDel" style="display:none;margin-right:auto" onclick="delDecision()">삭제</button>
      <button class="btn" onclick="closeDecModal()">취소</button>
      <button class="btn btn-pri" onclick="saveDecModal()">저장</button>
    </div>
  </div>
</div>

<div class="save-toast" id="toast">Saved</div>

<script>
// ── State ──
let projects=[], curProj=null, tasks=[], schemaData=null, missionData=null;
let decisions=[], velocityData=null;
let view='kanban', doneTab='date';
const COLS=[
  {id:'backlog',label:'Backlog',color:'var(--backlog)'},
  {id:'todo',label:'To Do',color:'var(--todo)'},
  {id:'in_progress',label:'In Progress',color:'var(--in_progress)'},
  {id:'review',label:'Review',color:'var(--review)'},
];
const SL={backlog:'Backlog',todo:'To Do',in_progress:'In Progress',review:'Review',done:'Done'};

// ── API ──
async function api(m,p,b){
  const o={method:m,headers:{'Content-Type':'application/json'}};
  if(b)o.body=JSON.stringify(b);
  return (await fetch(p,o)).json();
}
function apiP(p){ return '/api/'+curProj+p; }

// ── Init ──
async function init(){
  projects=await api('GET','/api/projects');
  renderProjSelector();
  const h=location.hash.slice(1);
  curProj=(projects.find(p=>p.key===h)||projects[0]||{}).key;
  if(curProj){location.hash=curProj; await load();}
  // Close dropdown when clicking outside
  document.addEventListener('click',e=>{
    if(!e.target.closest('#projSelect')) closeProjDrop();
  });
}
async function load(){
  if(!curProj)return;
  tasks=await api('GET',apiP('/tasks'));
  renderProjSelector();
  renderHeaderStats();
  if(view==='mission') loadMission();
  else if(view==='log') loadLog();
  else if(view==='stats') loadStats();
  else render();
}
function switchProj(k){
  curProj=k; location.hash=k; schemaData=null; missionData=null;
  renderProjSelector(); load();
}
function renderProjSelector(){
  const cur=projects.find(p=>p.key===curProj);
  document.getElementById('projLabel').textContent=cur?cur.name:'No Project';
  document.getElementById('projDropdown').innerHTML=projects.map(p=>
    '<div class="proj-drop-item'+(p.key===curProj?' active':'')+'" onclick="switchProj(\''+esc(p.key)+'\');closeProjDrop()">'
    +'<span class="proj-drop-dot"></span>'+esc(p.name)+'</div>'
  ).join('');
}
function toggleProjDrop(e){
  e.stopPropagation();
  document.getElementById('projDropdown').classList.toggle('open');
}
function closeProjDrop(){
  document.getElementById('projDropdown').classList.remove('open');
}
function renderHeaderStats(){
  const done=tasks.filter(t=>t.status==='done');
  document.getElementById('sIP').textContent=tasks.filter(t=>t.status==='in_progress').length;
  document.getElementById('sWait').textContent=tasks.filter(t=>t.status==='backlog'||t.status==='todo').length;
  document.getElementById('sDone').textContent=done.length;
  document.getElementById('sAll').textContent=tasks.length;
  document.getElementById('doneCnt').textContent=done.length;
}

// ── View ──
function setView(v){
  view=v;
  document.querySelectorAll('.vtab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  if(v==='mission') loadMission();
  else if(v==='log') loadLog();
  else if(v==='stats') loadStats();
  else render();
}
function setDoneTab(t){
  doneTab=t;
  document.querySelectorAll('.dtab').forEach(b=>b.classList.toggle('active',b.dataset.g===t));
  renderDone(tasks.filter(t=>t.status==='done'));
}

// ── Theme ──
function toggleTheme(){
  document.documentElement.classList.toggle('light');
  localStorage.setItem('vk-theme',document.documentElement.classList.contains('light')?'light':'dark');
}
if(localStorage.getItem('vk-theme')==='light')document.documentElement.classList.add('light');

// ── Mission View ──
async function loadMission(){
  const w=document.getElementById('missionWrap');
  w.classList.add('active');
  document.getElementById('kanban').classList.add('hide');
  document.getElementById('listWrap').classList.remove('active');
  document.getElementById('schemaWrap').classList.remove('active');
  document.getElementById('logWrap').classList.remove('active');
  document.getElementById('statsWrap').classList.remove('active');
  document.getElementById('resizer').classList.add('hide');
  document.getElementById('doneZone').classList.add('hide');
  if(!curProj){w.innerHTML='<div class="mission-no-phase"><h3>프로젝트 없음</h3></div>';return;}
  try{
    missionData=await api('GET',apiP('/context'));
    renderMission();
  }catch(e){
    w.innerHTML='<div class="mission-no-phase"><h3>로딩 실패</h3><p>서버를 확인해주세요</p></div>';
  }
}

function renderMission(){
  const w=document.getElementById('missionWrap');
  const m=missionData;
  if(!m){return;}

  const total=m.checklist.total||0;
  const done=m.checklist.done||0;
  const pct=total?Math.round(done/total*100):0;

  // Phase header
  const noPhase=!m.phase;
  const phaseHtml=noPhase
    ?'<div class="mission-no-phase"><h3>CURRENT_PHASE.md 없음</h3><p>프로젝트 루트의 <code>private/CURRENT_PHASE.md</code> 또는 <code>docs/CURRENT_PHASE.md</code>를 생성하면 미션 현황이 표시됩니다.</p></div>'
    :`<div class="mission-phase-header">
        <div class="mph-top">
          <span class="mph-name">🎯 ${esc(m.phase)}</span>
          <span class="mph-pct">${pct}%</span>
        </div>
        <div class="mph-bar"><div class="mph-fill" style="width:${pct}%"></div></div>
        ${m.scope?`<div class="mph-sub">${esc(m.scope)}</div>`:''}
        <div class="mph-checks">${done}/${total} 완료 · 백로그 ${m.stats.backlog||0} · 진행 ${m.stats.in_progress||0} · 검토 ${m.stats.review||0}</div>
      </div>`;

  // In-progress tasks
  const ipHtml=m.in_progress.length
    ?m.in_progress.map(t=>`
        <div class="mission-task-card active" onclick="openDet(${t.id})">
          <span class="mtask-num">#${t.id}</span>
          <span class="mtask-title">${esc(t.title)}</span>
          ${t.category?`<span class="tag">${esc(t.category)}</span>`:''}
          ${t.started_at?`<span class="mtask-elapsed">${elapsed(t.started_at,null)||''}</span>`:''}
        </div>`).join('')
    :'<div class="mission-empty-msg">진행 중인 작업 없음</div>';

  // Checklist
  const clHtml=m.checklist.items.length
    ?m.checklist.items.map(c=>`
        <div class="mission-check-item${c.done?' done':''}">
          <span class="check-icon">${c.done?'✓':'○'}</span>
          <span class="check-text">${esc(c.text)}</span>
        </div>`).join('')
    :'<div class="mission-empty-msg">체크리스트 없음</div>';

  // Do not touch
  const dntHtml=m.do_not_touch.length
    ?m.do_not_touch.map(s=>`<div class="mission-lock-item">${esc(s)}</div>`).join('')
    :'<div class="mission-empty-msg">제한 없음</div>';

  // Recent done
  const rdHtml=m.recent_done.length
    ?m.recent_done.map(t=>`
        <div class="mission-done-item" onclick="openDet(${t.id})" style="cursor:pointer">
          <span style="flex:1">${esc(t.title)}</span>
          ${t.completed_at?`<span style="font-size:10px;color:var(--text-faint)">${shortDate(t.completed_at)}</span>`:''}
        </div>`).join('')
    :'<div class="mission-empty-msg">완료 항목 없음</div>';

  w.innerHTML=phaseHtml+(noPhase?'':
    `<div class="mission-grid">
      <div class="mission-panel">
        <div class="mp-label">🔥 지금 작업 중</div>
        ${ipHtml}
      </div>
      <div class="mission-panel">
        <div class="mp-label">✅ 최근 완료</div>
        ${rdHtml}
      </div>
      <div class="mission-panel">
        <div class="mp-label">📋 완료 체크리스트</div>
        <div>${clHtml}</div>
      </div>
      <div class="mission-panel">
        <div class="mp-label">🔒 건드리면 안 되는 것</div>
        ${dntHtml}
      </div>
    </div>`);
}

// ── Decision Log ──
async function loadLog(){
  const w=document.getElementById('logWrap');
  w.classList.add('active');
  document.getElementById('kanban').classList.add('hide');
  document.getElementById('listWrap').classList.remove('active');
  document.getElementById('schemaWrap').classList.remove('active');
  document.getElementById('missionWrap').classList.remove('active');
  document.getElementById('statsWrap').classList.remove('active');
  document.getElementById('resizer').classList.add('hide');
  document.getElementById('doneZone').classList.add('hide');
  if(!curProj){w.innerHTML='<div class="dec-empty"><h3>프로젝트 없음</h3></div>';return;}
  try{
    decisions=await api('GET',apiP('/decisions'));
    renderLog();
  }catch(e){
    w.innerHTML='<div class="dec-empty"><h3>로딩 실패</h3></div>';
  }
}

function renderLog(){
  const w=document.getElementById('logWrap');
  if(!decisions.length){
    w.innerHTML=`<div class="log-toolbar"><h3>📋 Decision Log</h3><button class="btn btn-pri" onclick="openAddDec()">+ 결정 기록</button></div>
      <div class="dec-empty">
        <h3>아직 기록된 결정이 없습니다</h3>
        <p>중요한 기술 결정을 여기에 남겨두세요.<br>
        나중에 "왜 이렇게 했지?"를 찾는 시간을 줄여줍니다.</p>
        <p style="margin-top:12px"><code>/vibe-harness decide "결정 제목"</code></p>
      </div>`;
    return;
  }
  const cards=decisions.slice().reverse().map(d=>{
    const taskLnk=d.task_id?`<span class="tag">#${d.task_id}</span>`:'';
    const ph=d.phase?`<span class="tag">${esc(d.phase)}</span>`:'';
    const dt=d.created_at?`<span style="font-size:10px;color:var(--text-faint)">${shortDate(d.created_at)}</span>`:'';
    return `<div class="dec-card" onclick="openEditDec(${d.id})">
      <div class="dec-card-top">
        <div class="dec-title">${esc(d.title)}</div>
        <div class="dec-acts">
          <button class="dec-act del" onclick="event.stopPropagation();confirmDelDec(${d.id})">&times;</button>
        </div>
      </div>
      <div class="dec-meta">${ph}${taskLnk}${dt}</div>
      ${d.why?`<div class="dec-row"><b>Why:</b> ${esc(d.why)}</div>`:''}
      ${d.revisit?`<div class="dec-row revisit"><b>Revisit:</b> ${esc(d.revisit)}</div>`:''}
    </div>`;
  }).join('');
  w.innerHTML=`<div class="log-toolbar"><h3>📋 Decision Log <span style="font-size:11px;color:var(--text-faint);font-weight:400">(${decisions.length}건)</span></h3>
    <button class="btn btn-pri" onclick="openAddDec()">+ 결정 기록</button></div>
    <div class="dec-grid">${cards}</div>`;
}

function openAddDec(){
  document.getElementById('decMHeading').textContent='결정 기록';
  document.getElementById('decMId').value='';
  document.getElementById('decMName').value='';
  ['decMWhy','decMRevisit'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('decMPhase').value=
    document.querySelector('#missionWrap .mph-name')?.textContent?.replace('🎯 ','') || '';
  document.getElementById('decMTask').value='';
  document.getElementById('decMDel').style.display='none';
  document.getElementById('decModalBg').classList.add('open');
  setTimeout(()=>document.getElementById('decMName').focus(),80);
}
function openEditDec(id){
  const d=decisions.find(x=>x.id===id);if(!d)return;
  document.getElementById('decMHeading').textContent='결정 수정';
  document.getElementById('decMId').value=d.id;
  document.getElementById('decMName').value=d.title;
  document.getElementById('decMWhy').value=d.why||'';
  document.getElementById('decMRevisit').value=d.revisit||'';
  document.getElementById('decMPhase').value=d.phase||'';
  document.getElementById('decMTask').value=d.task_id||'';
  document.getElementById('decMDel').style.display='block';
  document.getElementById('decModalBg').classList.add('open');
}
function closeDecModal(){ document.getElementById('decModalBg').classList.remove('open'); }
async function saveDecModal(){
  const id=document.getElementById('decMId').value;
  const d={
    title:document.getElementById('decMName').value.trim(),
    why:document.getElementById('decMWhy').value.trim(),
    revisit:document.getElementById('decMRevisit').value.trim(),
    phase:document.getElementById('decMPhase').value.trim(),
    task_id:parseInt(document.getElementById('decMTask').value)||null,
  };
  if(!d.title)return alert('결정 제목을 입력하세요');
  await api(id?'PUT':'POST', id?apiP('/decisions/'+id):apiP('/decisions'), d);
  closeDecModal(); toast(); loadLog();
}
async function delDecision(){
  const id=document.getElementById('decMId').value;
  if(!id||!confirm('삭제할까요?'))return;
  await api('DELETE',apiP('/decisions/'+id));
  closeDecModal(); loadLog();
}
async function confirmDelDec(id){
  if(!confirm('삭제할까요?'))return;
  await api('DELETE',apiP('/decisions/'+id));
  loadLog();
}

function renderStats(){
  const w=document.getElementById('statsWrap');
  const v=velocityData;
  if(!v){return;}

  // KPI row
  const totalDoneRate=v.total_tasks?Math.round(v.total_done/v.total_tasks*100):0;
  const kpiHtml=`<div class="sp-kpi-row">
    <div class="sp-kpi"><div class="sp-kpi-val">${v.total_tasks}</div><div class="sp-kpi-lbl">전체 태스크</div></div>
    <div class="sp-kpi"><div class="sp-kpi-val" style="color:var(--done)">${v.total_done}</div><div class="sp-kpi-lbl">완료</div></div>
    <div class="sp-kpi"><div class="sp-kpi-val" style="color:var(--accent)">${totalDoneRate}%</div><div class="sp-kpi-lbl">완료율</div></div>
    <div class="sp-kpi"><div class="sp-kpi-val" style="color:var(--purple)">${fmtTokens(v.total_tokens)}</div><div class="sp-kpi-lbl">총 토큰</div></div>
    <div class="sp-kpi"><div class="sp-kpi-val" style="color:var(--orange);font-size:20px">$${v.total_cost_usd}</div><div class="sp-kpi-lbl">추정 비용</div></div>
  </div>`;

  // Phase burndown
  const phaseHtml=v.phases.length
    ?v.phases.map(p=>`
      <div class="phase-row">
        <div class="phase-name">${esc(p.phase)}</div>
        <div class="phase-bar-wrap"><div class="phase-bar-fill" style="width:${p.pct}%"></div></div>
        <div class="phase-pct">${p.pct}%</div>
        <div class="phase-cost" title="토큰: ${p.tokens.toLocaleString()}">$${p.cost_usd}</div>
      </div>`).join('')
    :'<div style="color:var(--text-faint);font-size:12px;padding:8px 0">Phase 데이터 없음 — 태스크에 Phase를 입력하세요</div>';

  // Daily trend chart
  const maxCount=Math.max(1,...v.daily_trend.map(d=>d.count));
  const trendHtml=v.daily_trend.length
    ?`<div class="trend-bars">`+v.daily_trend.map(d=>{
        const pct=Math.max(3,Math.round(d.count/maxCount*100));
        return `<div class="trend-col" title="${d.date}: ${d.count}건">
          <div class="trend-bar-track"><div class="trend-bar" style="height:${pct}%"></div></div>
          <div class="trend-date">${d.date.slice(5)}</div>
        </div>`;
      }).join('')+`</div>`
    :'<div style="color:var(--text-faint);font-size:12px">완료 태스크 없음</div>';

  // Category breakdown
  const maxCatTokens=Math.max(1,...v.category_breakdown.map(c=>c.tokens));
  const catHtml=v.category_breakdown.length
    ?v.category_breakdown.slice(0,8).map(c=>`
      <div class="cat-row">
        <div class="cat-name">${esc(c.category)}</div>
        <div class="cat-bar-wrap"><div class="cat-bar-fill" style="width:${Math.round(c.tokens/maxCatTokens*100)}%"></div></div>
        <div class="cat-cost">${fmtTokens(c.tokens)}</div>
      </div>`).join('')
    :'<div style="color:var(--text-faint);font-size:12px">토큰 데이터 없음</div>';

  // Agent / model breakdown (from runs.json)
  const agents=v.agent_breakdown||[], models=v.model_breakdown||[];
  const maxAgentTokens=Math.max(1,...agents.map(a=>a.tokens));
  const agentHtml=agents.length
    ?agents.map(a=>`
      <div class="cat-row">
        <div class="cat-name" title="${a.runs} run(s)">${esc(a.agent)}</div>
        <div class="cat-bar-wrap"><div class="cat-bar-fill" style="width:${Math.round(a.tokens/maxAgentTokens*100)}%;background:var(--purple)"></div></div>
        <div class="cat-cost" title="${a.tokens.toLocaleString()} tokens">${fmtTokens(a.tokens)} · $${a.cost_usd}</div>
      </div>`).join('')
      +(models.length?`<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:6px">`
        +models.map(m=>`<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-faint);padding:1px 0">
          <span>${esc(m.agent)} / ${esc(m.model||'—')}</span><span>${fmtTokens(m.tokens)} · $${m.cost_usd}</span></div>`).join('')+`</div>`:'')
    :'<div style="color:var(--text-faint);font-size:12px">runs.json 기록 없음 — 완료 시 에이전트 run을 기록하세요</div>';

  w.innerHTML=`
    <div class="stats-grid">
      <div class="stats-panel full">
        <div class="sp-label">📊 전체 현황</div>
        ${kpiHtml}
      </div>
      <div class="stats-panel full">
        <div class="sp-label">🏁 Phase 번다운</div>
        ${phaseHtml}
      </div>
      <div class="stats-panel">
        <div class="sp-label">📅 일별 완료 추이 (최근 30일)</div>
        ${trendHtml}
      </div>
      <div class="stats-panel">
        <div class="sp-label">🏷️ 카테고리별 토큰 사용</div>
        ${catHtml}
      </div>
      <div class="stats-panel">
        <div class="sp-label">🤖 에이전트별 토큰·비용${v.total_runs?` (${v.total_runs} runs)`:''}</div>
        ${agentHtml}
        <div style="margin-top:8px;font-size:9px;color:var(--text-faint)">단가: Codex/GPT ~$6 · Claude Opus ~$30 / Sonnet ~$9 · Gemini ~$4 /MTok (블렌드 추정)</div>
      </div>
    </div>`;
}

// ── Render ──
function render(){
  const active=tasks.filter(t=>t.status!=='done');
  const done=tasks.filter(t=>t.status==='done');

  const kb=document.getElementById('kanban');
  const lw=document.getElementById('listWrap');
  const sw=document.getElementById('schemaWrap');
  const mw=document.getElementById('missionWrap');
  const logw=document.getElementById('logWrap');
  const statsw=document.getElementById('statsWrap');
  const rz=document.getElementById('resizer');
  const dz=document.getElementById('doneZone');

  kb.classList.add('hide');
  lw.classList.remove('active'); sw.classList.remove('active'); mw.classList.remove('active');
  logw.classList.remove('active'); statsw.classList.remove('active');
  rz.classList.add('hide'); dz.classList.add('hide');

  if(view==='kanban'){
    kb.classList.remove('hide');
    rz.classList.remove('hide'); dz.classList.remove('hide');
    renderKanban(active);
    renderDone(done);
  } else if(view==='list'){
    lw.classList.add('active');
    renderList();
  } else if(view==='schema'){
    sw.classList.add('active');
    loadSchema();
  }
}

// ── Kanban ──
function renderKanban(active){
  const kb=document.getElementById('kanban');
  kb.innerHTML=COLS.map(col=>{
    const items=active.filter(t=>t.status===col.id);
    return '<div class="column"><div class="col-head"><div class="col-label"><div class="dot" style="background:'+col.color+'"></div>'+col.label+'</div><span class="col-cnt">'+items.length+'</span></div>'
      +'<div class="col-body drop-zone" data-st="'+col.id+'">'+items.map(cardHtml).join('')+'</div>'
      +'<button class="add-btn" onclick="openAdd(\''+col.id+'\')">+ 추가</button></div>';
  }).join('');
  bindDrag();
}

function cardHtml(t){
  let meta='';
  if(t.priority)meta+='<span class="tag '+t.priority+'">'+t.priority[0].toUpperCase()+'</span>';
  if(t.category)meta+='<span class="tag">'+esc(t.category)+'</span>';
  if(t.phase)meta+='<span class="tag">'+esc(t.phase)+'</span>';
  if(t.created_by)meta+='<span class="tag" style="opacity:.6" title="생성자">'+esc(t.created_by)+'</span>';
  if(t.assigned_to)meta+='<span class="tag user">@'+esc(t.assigned_to)+'</span>';
  if((t.status==='todo'||t.status==='in_progress')&&t.target_date){
    const dd=dday(t.target_date);
    if(dd!==null){
      const cls=dd<0?'overdue':dd<=3?'soon':'ok';
      const lb=dd<0?'D+'+(-dd):dd===0?'D-Day':'D-'+dd;
      meta+='<span class="dday '+cls+'">'+lb+'</span>';
    }
  }
  const la=t.lines_added||0,lr=t.lines_removed||0;
  if(la||lr)meta+=linesHtml(la,lr);
  meta+=reviewBadgeHtml(t);
  return '<div class="card" data-id="'+t.id+'" onclick="openDet('+t.id+')" draggable="true">'
    +'<div class="card-top"><div class="card-title">'+esc(t.title)+'</div>'
    +'<div class="card-acts">'
    +'<button class="card-act" onclick="event.stopPropagation();openEdit('+t.id+')" title="수정">&#9998;</button>'
    +'<button class="card-act del" onclick="event.stopPropagation();confirmDel('+t.id+')" title="삭제">&times;</button>'
    +'</div></div>'
    +(t.description?'<div class="card-desc">'+esc(t.description)+'</div>':'')
    +'<div class="card-meta">'+meta+'</div></div>';
}

// ── Done Zone ──
function renderDone(done){
  if(!done)done=tasks.filter(t=>t.status==='done');
  const el=document.getElementById('doneBody');
  if(!done.length){el.innerHTML='<div style="color:var(--text-dim);padding:12px;font-size:11px">완료된 작업이 없습니다</div>';return;}
  const groups={};
  done.forEach(t=>{
    let key;
    if(doneTab==='date') key=shortDate(t.completed_at||t.updated_at||t.created_at);
    else if(doneTab==='category') key=t.category||'기타';
    else key=t.phase||'No Phase';
    (groups[key]=groups[key]||[]).push(t);
  });
  const keys=doneTab==='date'?Object.keys(groups).sort().reverse():Object.keys(groups).sort();
  el.innerHTML=keys.map(k=>
    '<div class="done-group"><div class="done-gh">'+esc(k)+' <span>'+groups[k].length+'건</span></div>'
    +'<div class="done-list">'+groups[k].map(doneCardHtml).join('')+'</div></div>'
  ).join('');
}

function doneCardHtml(t){
  const el=elapsed(t.started_at,t.completed_at||t.updated_at);
  const la=t.lines_added||0,lr=t.lines_removed||0;
  let meta='';
  if(t.category)meta+='<span class="tag">'+esc(t.category)+'</span>';
  if(t.phase)meta+='<span class="tag">'+esc(t.phase)+'</span>';
  if(t.assigned_to)meta+='<span class="tag user">@'+esc(t.assigned_to)+'</span>';
  if(el)meta+='<span class="tag" style="color:var(--purple)">'+el+'</span>';
  if(la||lr)meta+=linesHtml(la,lr);
  if(t.tokens_used)meta+='<span class="tag" style="color:var(--purple);opacity:.8" title="사용 토큰(추정)">~'+fmtTokens(t.tokens_used)+'</span>';
  meta+=reviewBadgeHtml(t);
  const cd=shortDate(t.completed_at||t.updated_at);
  if(cd)meta+='<span class="tag" style="opacity:.7">'+cd+'</span>';
  return '<div class="done-card" onclick="openDet('+t.id+')">'
    +'<div class="card-top"><span class="done-ck">&#x2713;</span><div class="card-title">'+esc(t.title)+'</div></div>'
    +(t.description?'<div class="card-desc">'+esc(t.description)+'</div>':'')
    +'<div class="card-meta">'+meta+'</div></div>';
}

// ── List View (ALL tasks) ──
function renderList(){
  const body=document.getElementById('listBody');
  // Sort: in_progress first, then todo, review, backlog, done last
  const order={in_progress:0,todo:1,review:2,backlog:3,done:4};
  const sorted=[...tasks].sort((a,b)=>(order[a.status]||9)-(order[b.status]||9));
  body.innerHTML=sorted.map(t=>{
    const la=t.lines_added||0,lr=t.lines_removed||0;
    const isDone=t.status==='done';
    return '<tr class="'+(isDone?'done-row':'')+'" data-id="'+t.id+'">'
      +'<td><select onchange="inlineUpd('+t.id+',\'status\',this.value)">'
      +['backlog','todo','in_progress','review','done'].map(s=>'<option value="'+s+'"'+(t.status===s?' selected':'')+'>'+SL[s]+'</option>').join('')
      +'</select></td>'
      +'<td><select onchange="inlineUpd('+t.id+',\'priority\',this.value)">'
      +['low','medium','high'].map(p=>'<option value="'+p+'"'+(t.priority===p?' selected':'')+'>'+p+'</option>').join('')
      +'</select></td>'
      +'<td class="card-title-cell" contenteditable="true" onblur="inlineBlur('+t.id+',\'title\',this)">'+esc(t.title)+'</td>'
      +'<td class="desc-cell" contenteditable="true" onblur="inlineBlur('+t.id+',\'description\',this)">'+esc(t.description||'')+'</td>'
      +'<td contenteditable="true" onblur="inlineBlur('+t.id+',\'category\',this)">'+esc(t.category||'')+'</td>'
      +'<td contenteditable="true" onblur="inlineBlur('+t.id+',\'phase\',this)">'+esc(t.phase||'')+'</td>'
      +'<td contenteditable="true" onblur="inlineBlur('+t.id+',\'created_by\',this)">'+esc(t.created_by||'')+'</td>'
      +'<td contenteditable="true" onblur="inlineBlur('+t.id+',\'assigned_to\',this)">'+esc(t.assigned_to||'')+'</td>'
      +'<td contenteditable="true" onblur="inlineBlur('+t.id+',\'target_date\',this)">'+esc(t.target_date||'')+'</td>'
      +'<td>'+((la||lr)?linesHtml(la,lr):'')+'</td>'
      +'<td><button class="list-del" onclick="confirmDel('+t.id+')">&times;</button></td>'
      +'</tr>';
  }).join('');
  body.querySelectorAll('td[contenteditable]').forEach(td=>{
    td.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();td.blur();}});
  });
}

function inlineUpd(id,f,v){ api('PUT',apiP('/tasks/'+id),{[f]:v}).then(()=>{toast();load();}); }
function inlineBlur(id,f,el){
  const orig=tasks.find(t=>t.id===id);
  const val=el.textContent.trim();
  if(orig&&orig[f]!==val) api('PUT',apiP('/tasks/'+id),{[f]:val}).then(()=>{toast();load();});
}

// ── Detail Panel ──
function openDet(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const el=elapsed(t.started_at,t.completed_at||t.updated_at);
  const la=t.lines_added||0,lr=t.lines_removed||0;
  document.getElementById('detPanel').innerHTML=

// ── Drag & Drop ──
function bindDrag(){
  document.querySelectorAll('.card[draggable]').forEach(c=>{
    c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('dragging');});
    c.addEventListener('dragend',()=>c.classList.remove('dragging'));
  });
  document.querySelectorAll('.drop-zone').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',async e=>{
      e.preventDefault();z.classList.remove('over');
      const id=e.dataTransfer.getData('text/plain');
      if(id)await api('PUT',apiP('/tasks/'+id),{status:z.dataset.st});
      load();
    });
  });
  // Done zone drop
  const dz=document.getElementById('doneZone');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderTopColor='var(--done)';});
  dz.addEventListener('dragleave',()=>{dz.style.borderTopColor='';});
  dz.addEventListener('drop',async e=>{
    e.preventDefault();dz.style.borderTopColor='';
    const id=e.dataTransfer.getData('text/plain');
    if(id){await api('PUT',apiP('/tasks/'+id),{status:'done'});load();}
  });
}

// ── Resizer ──
const rz=document.getElementById('resizer'), dz=document.getElementById('doneZone');
rz.addEventListener('mousedown',e=>{
  const sy=e.clientY,sh=dz.offsetHeight;
  const mv=e=>{dz.style.height=Math.max(60,Math.min(window.innerHeight*.7,sh-(e.clientY-sy)))+'px';};
  const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
});

// ── Helpers ──
function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML;}
function shortDate(s){if(!s)return '';const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[1].slice(2)+m[2]+m[3]:s;}
function dday(s){const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]),n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/864e5);}
function elapsed(s,e){
  if(!s||!e)return '';
  const a=String(s).match(/(\d{4})-(\d{2})-(\d{2})/),b=String(e).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!a||!b)return '';
  const d=Math.round((new Date(+b[1],+b[2]-1,+b[3])-new Date(+a[1],+a[2]-1,+a[3]))/864e5);
  return d<0?'':d===0?'당일':d+'일';
}
function fmtTokens(n){if(!n)return '0';if(n>=1000000)return (n/1000000).toFixed(1)+'M';if(n>=1000)return Math.round(n/1000)+'K';return String(n);}
function linesHtml(a,r){
  if(!a&&!r)return '';
  const t=a+r,sc=Math.min(1,150/t),aw=Math.max(1,Math.round(a*sc)),rw=Math.max(1,Math.round(r*sc));
  return '<span class="lines-bar" style="width:'+(aw+rw)+'px"><span class="a" style="width:'+aw+'px"></span><span class="r" style="width:'+rw+'px"></span></span><span class="lines-lbl">+'+a+' -'+r+'</span>';
}
function toast(){
  const t=document.getElementById('toast');t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1200);
}

// ── Schema/ERD ──
async function loadSchema(){
  if(!curProj)return;
  schemaData=await api('GET',apiP('/schema'));
  renderSchema();
}
function renderSchema(){
  const el=document.getElementById('schemaWrap');
  if(!schemaData||!schemaData.tables||!schemaData.tables.length){
    el.innerHTML='<div class="schema-empty">'
      +'<div style="font-size:24px;margin-bottom:12px">📋</div>'
      +'<div>스키마 파일을 찾을 수 없습니다</div>'
      +'<div style="margin-top:8px;font-size:11px">지원 형식: <code>schema.rb</code> <code>structure.sql</code> <code>schema.prisma</code> <code>migrations/*.sql</code></div>'
      +'<div style="margin-top:4px;font-size:11px">프로젝트 루트에 위 파일이 있는지 확인하세요</div></div>';
    return;
  }
  const {tables,relationships,files}=schemaData;
  // Info bar
  let html='<div class="schema-info">';
  files.forEach(f=>{ html+='<button class="file-tag active" data-file="'+esc(f.path)+'">'+esc(f.path)+' ('+f.type+')</button>'; });
  html+='<div class="schema-legend">'
    +'<span><span class="dot-pk"></span>PK</span>'
    +'<span><span class="dot-fk"></span>FK</span>'
    +'<span><span class="dot-uq"></span>UQ</span>'
    +'<span><span class="dot-nn"></span>NN</span>'
    +'</div></div>';
  // Canvas with tables + SVG overlay
  html+='<div class="schema-canvas" id="schemaCanvas">';
  html+='<svg class="schema-svg" id="schemaSvg"></svg>';
  html+='<div class="schema-grid" id="schemaGrid">';
  tables.forEach(t=>{
    html+='<div class="schema-tbl" id="stbl_'+esc(t.name)+'" data-tbl="'+esc(t.name)+'"'+(t.source_file?' data-source-file="'+esc(t.source_file)+'"':'')+'>';
    html+='<div class="schema-tbl-head"><span class="tbl-icon">⊞</span> '+esc(t.name);
    if(t.schema) html+=' <span class="tbl-schema">'+esc(t.schema)+'</span>';
    html+=' <span style="color:var(--text-faint);font-weight:400;font-size:9px;margin-left:auto">'+t.columns.length+' cols</span></div>';
    t.columns.forEach(c=>{
      let cls='schema-col-name';
      if(c.pk) cls+=' is-pk';
      else if(c.fk) cls+=' is-fk';
      const fkTable=c.fk?c.fk.split('(')[0]:'';
      const fkCol=c.fk?(c.fk.match(/\(([^)]+)\)/)||['',''])[1]:'';
      html+='<div class="schema-col-row" data-col="'+esc(c.name)+'"'+(c.fk?' data-fk-target="'+esc(fkTable)+'" data-fk-col="'+esc(fkCol)+'"':'')+'>';
      html+='<span class="'+cls+'">'+esc(c.name)+'</span>';
      html+='<span class="schema-col-type">'+esc(c.type)+'</span>';
      html+='<span class="schema-badges">';
      if(c.pk) html+='<span class="schema-badge pk">PK</span>';
      if(c.fk) html+='<span class="schema-badge fk">FK</span>';
      if(c.unique&&!c.pk) html+='<span class="schema-badge uq">UQ</span>';
      if(!c.nullable&&!c.pk) html+='<span class="schema-badge nn">NN</span>';
      if(c.default!==null&&c.default!==undefined) html+='<span class="schema-badge df" title="'+esc(String(c.default))+'">DF</span>';
      html+='</span>';
      if(c.fk) html+='<span class="schema-fk-ref">→ '+esc(c.fk)+'</span>';
      html+='</div>';
    });
    if(t.indexes&&t.indexes.length){
      html+='<div class="schema-idx-section"><div class="schema-idx-label">Indexes</div>';
      t.indexes.forEach(ix=>{
        html+='<div class="schema-idx-row">';
        if(ix.unique) html+='<span class="idx-uq">UQ</span>';
        html+=esc(ix.name)+' ('+ix.columns.map(c=>esc(c)).join(', ')+')';
        html+='</div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  html+='</div></div>';
  // Relationships summary
  if(relationships.length){
    html+='<div class="schema-rels-section"><h4>Relationships ('+relationships.length+')</h4>';
    relationships.forEach(r=>{
      html+='<div class="schema-rel-row">'
        +esc(r.from_table)+'.'+esc(r.from_column)
        +' <span class="schema-rel-arrow">→</span> '
        +esc(r.to_table)+'.'+esc(r.to_column)
        +'</div>';
    });
    html+='</div>';
  }
  el.innerHTML=html;
  // File tag filter toggle
  el.querySelectorAll('.file-tag').forEach(btn=>{
    btn.addEventListener('click',()=>{
      btn.classList.toggle('active');
      const activeFiles=new Set([...el.querySelectorAll('.file-tag.active')].map(b=>b.dataset.file));
      el.querySelectorAll('.schema-tbl').forEach(tbl=>{
        const sf=tbl.dataset.sourceFile;
        tbl.classList.toggle('file-hidden', sf&&!activeFiles.has(sf));
      });
    });
  });
  // Draw SVG relationship lines after render
  requestAnimationFrame(()=>drawSchemaLines(relationships));
}
function drawSchemaLines(rels){
  const svg=document.getElementById('schemaSvg');
  const canvas=document.getElementById('schemaCanvas');
  if(!svg||!canvas||!rels.length)return;
  const cr=canvas.getBoundingClientRect();
  svg.setAttribute('width',canvas.scrollWidth);
  svg.setAttribute('height',canvas.scrollHeight);
  svg.innerHTML='';
  const colors=['var(--purple)','var(--accent)','var(--orange)','var(--green)','var(--red)'];
  rels.forEach((r,i)=>{
    const fromEl=document.getElementById('stbl_'+r.from_table);
    const toEl=document.getElementById('stbl_'+r.to_table);
    if(!fromEl||!toEl)return;
    const fr=fromEl.getBoundingClientRect();
    const tr=toEl.getBoundingClientRect();
    // Find FK column row for more precise positioning
    const fkRow=fromEl.querySelector('[data-col="'+r.from_column+'"]');
    const pkRow=toEl.querySelector('[data-col="'+r.to_column+'"]');
    const fy=fkRow?(fkRow.getBoundingClientRect().top+fkRow.getBoundingClientRect().height/2-cr.top)
      :(fr.top+fr.height/2-cr.top);
    const ty=pkRow?(pkRow.getBoundingClientRect().top+pkRow.getBoundingClientRect().height/2-cr.top)
      :(tr.top+tr.height/2-cr.top);
    // Determine connection side
    let fx,tx;
    const fCx=fr.left+fr.width/2-cr.left, tCx=tr.left+tr.width/2-cr.left;
    if(fCx<tCx){ fx=fr.right-cr.left; tx=tr.left-cr.left; }
    else { fx=fr.left-cr.left; tx=tr.right-cr.left; }
    const col=colors[i%colors.length];
    // Draw bezier curve
    const dx=Math.abs(tx-fx)*0.4;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','M'+fx+','+fy+' C'+(fx+(fCx<tCx?dx:-dx))+','+fy+' '+(tx+(fCx<tCx?-dx:dx))+','+ty+' '+tx+','+ty);
    path.setAttribute('stroke',col);
    path.setAttribute('stroke-width','1.5');
    path.setAttribute('fill','none');
    path.setAttribute('opacity','0.5');
    path.setAttribute('stroke-dasharray','4,3');
    svg.appendChild(path);
    // Dots at endpoints
    [['cx',fx,'cy',fy],['cx',tx,'cy',ty]].forEach(([,x,,y])=>{
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r','3');
      c.setAttribute('fill',col); c.setAttribute('opacity','0.7');
      svg.appendChild(c);
    });
  });
}

// ── Schema FK jump ──
function clearFkHighlight(){
  document.querySelectorAll('.fk-highlight').forEach(el=>{
    el.classList.remove('fk-highlight');
    void el.offsetWidth; // reset animation state
  });
}
function jumpToFk(e){
  const row=e.target.closest('[data-fk-target]');
  if(!row){
    // clicked on non-FK area inside schema → clear highlight
    clearFkHighlight();
    return;
  }
  const tblName=row.dataset.fkTarget;
  const colName=row.dataset.fkCol;
  const tblEl=document.getElementById('stbl_'+tblName);
  if(!tblEl) return;
  // clear any existing highlight first
  clearFkHighlight();
  // scroll target table into view
  tblEl.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  // find target column row and highlight (stays until next action)
  const targetRow=colName
    ? tblEl.querySelector('[data-col="'+colName+'"]')
    : tblEl.querySelector('.schema-col-row');
  if(!targetRow) return;
  targetRow.classList.add('fk-highlight');
}
document.getElementById('schemaWrap').addEventListener('click',jumpToFk);

// ── Review ──
function parseReview(t){
  if(!t.review)return [];
  try{ return JSON.parse(t.review); }catch(e){ return []; }
}
function reviewBadgeHtml(t){
  const items=parseReview(t);
  if(!items.length)return '';
  const unresolved=items.filter(i=>!i.resolved).length;
  if(unresolved===0) return '<span class="review-badge all-ok">Review ✓</span>';
  return '<span class="review-badge has-issues">'+unresolved+' 미해결</span>';
}
function reviewDetHtml(t){
  const items=parseReview(t);
  if(!items.length)return '';
  const resolved=items.filter(i=>i.resolved).length;
  const unresolved=items.length-resolved;
  let html='<div class="det-field"><div class="det-label">코드 리뷰</div>';
  html+='<div class="review-summary"><span class="rs-ok">해결 '+resolved+'</span><span class="rs-ng">미해결 '+unresolved+'</span></div>';
  html+='<div class="review-section">';
  items.forEach((item,i)=>{
    const rid='rv_'+t.id+'_'+i;
    html+='<div class="review-item">'
      +'<div class="review-text'+(item.resolved?' resolved':'')+'">'+esc(item.text)+'</div>'
      +'<div class="review-radio">'
      +'<label class="rb-resolved"><input type="radio" name="'+rid+'" value="resolved"'+(item.resolved?' checked':'')+' onchange="toggleReview('+t.id+','+i+',true)"><span>해결</span></label>'
      +'<label class="rb-unresolved"><input type="radio" name="'+rid+'" value="unresolved"'+(!item.resolved?' checked':'')+' onchange="toggleReview('+t.id+','+i+',false)"><span>미해결</span></label>'
      +'</div></div>';
  });
  html+='</div></div>';
  return html;
}
async function toggleReview(taskId,idx,resolved){
  const t=tasks.find(x=>x.id===taskId);if(!t)return;
  const items=parseReview(t);
  if(idx<items.length){
    items[idx].resolved=resolved;
    await api('PUT',apiP('/tasks/'+taskId),{review:JSON.stringify(items)});
    toast();
    // Update local state and re-render detail
    t.review=JSON.stringify(items);
    openDet(taskId);
  }
}
