name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 공개 도구라 어느 파이썬에서 도는지가 사용자에게도 정보다.
      # 로컬에서는 3.13/3.14 만 확인할 수 있어, 하한은 CI 가 답한다.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: |
          python --version
          git --version

      - name: Compile all sources
        run: python -m compileall -q scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 런타임 의존성은 0으로 유지한다. ruff 는 CI 에서만 쓰는 개발 도구다.
      - name: Install ruff
        run: pip install ruff==0.16.3

      - name: Lint
        run: ruff check scripts tests

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ruff 와 같은 취급 — 런타임 의존성은 0으로 유지하고 CI 에서만 쓴다.
      # 한 버전에서만 잰다. 버전마다 재면 분기 커버리지가 미묘하게 달라져
      # 숫자가 흔들리고, 흔들리는 숫자는 곧 무시된다.
      - name: Install coverage
        run: pip install coverage==7.13.0

      - name: Measure
        run: |
          coverage run --source=scripts -m unittest discover -s tests
          coverage report --sort=cover

      # 목표치는 아직 정하지 않았다. 다만 **내려가는 것**은 막는다 —
      # 측정만 하고 아무 문턱이 없으면 그건 문서지 검사가 아니다.
      # 하한은 도입 시점 실측(51%)에서 한 칸 내려 잡았다. 플랫폼 차이로
      # 한두 줄 흔들려도 빨개지지 않게.
      - name: Floor
        run: coverage report --fail-under=50
